spring.application.name=SpringROA
# Connexio a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/Catan?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
# Esquema i SQL
spring.jpa.hibernate.ddl-auto=update
# Opcio rapida: imprimeix l'SQL per consola (sense parametres)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Opcio recomanada: pel sistema de log, amb els valors dels parametres (?)
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
# Port del servidor (per defecte 8080)
server.port=8080

# Desactiva "Open Session in View" (sessio 3 ho explica). Recomanat
spring.jpa.open-in-view=false

# Missatges d'error mes detallats a la resposta HTTP (nomes per desenvolupar)
server.error.include-message=always